</style></head><body>
<div id="root"></div>
<script type="text/plain" id="gsCode">/**
 * DRIPWELL BALI - Backend Google Drive & Google Sheets
 * Tempel seluruh isi file ini ke Google Apps Script, lalu Deploy sebagai Web app.
 *
 * Yang dibuat otomatis di Google Drive Anda:
 *   Dripwell Database/                (folder utama)
 *     Dripwell Database (Google Sheet: Patient Recap, Inventory, Finance)
 *     dripwell-backup.json            (database lengkap, selalu terbaru)
 *     Backups/backup-YYYY-MM-DD.json  (salinan harian)
 *     Medical Records/*.pdf
 *     Invoices/*.pdf
 *
 * Email pasien dikirim dari akun Google pemilik script ini (kuota harian Gmail berlaku).
 */
const SECRET = 'GANTI-KODE-RAHASIA-ANDA';   // harus SAMA dengan "Secret code" di aplikasi
const ROOT_NAME = 'Dripwell Database';
const REPLY_TO = 'dripwellbali@gmail.com';  // balasan email pasien akan masuk ke sini

function doGet(e) {
  try {
    const p = (e && e.parameter) || {};
    if (p.token !== SECRET) return out_({ ok: false, error: 'Wrong secret code' });
    if (p.action === 'restore') return out_(restore_());
    return out_({ ok: true, message: 'Dripwell backend is online' });
  } catch (err) { return out_({ ok: false, error: String(err) }); }
}

function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.token !== SECRET) return out_({ ok: false, error: 'Wrong secret code' });
    if (d.action === 'ping') return out_(ping_());
    if (d.action === 'syncAll') return out_(syncAll_(d));
    if (d.action === 'saveDoc') return out_(saveDoc_(d));
    if (d.action === 'deleteDocs') return out_(deleteDocs_(d));
    if (d.action === 'sendEmail') return out_(sendEmail_(d));
    return out_({ ok: false, error: 'Unknown action' });
  } catch (err) { return out_({ ok: false, error: String(err) }); }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function sub_(parent, name) {
  const it = parent.getFoldersByName(name);
  return it.hasNext() ? it.next() : parent.createFolder(name);
}

function root_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('ROOT_ID');
  if (id) { try { return DriveApp.getFolderById(id); } catch (x) {} }
  const it = DriveApp.getFoldersByName(ROOT_NAME);
  const f = it.hasNext() ? it.next() : DriveApp.createFolder(ROOT_NAME);
  props.setProperty('ROOT_ID', f.getId());
  return f;
}

function book_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('SHEET_ID');
  if (id) { try { return SpreadsheetApp.openById(id); } catch (x) {} }
  const ss = SpreadsheetApp.create('Dripwell Database');
  DriveApp.getFileById(ss.getId()).moveTo(root_());
  props.setProperty('SHEET_ID', ss.getId());
  return ss;
}

function write_(folder, name, text) {
  const it = folder.getFilesByName(name);
  if (it.hasNext()) { const f = it.next(); f.setContent(text); return f; }
  return folder.createFile(name, text, MimeType.PLAIN_TEXT);
}

function put_(ss, name, t, plain, rules) {
  const sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clear();
  sh.setConditionalFormatRules([]);
  const n = t.header.length;
  const rows = [t.header].concat(t.rows).map(function (r) {
    return r.map(function (v) {
      if (v == null) return '';
      if (!plain && typeof v === 'string' && /^[=+\-@]/.test(v)) return ' ' + v;
      return v;
    });
  });
  const rng = sh.getRange(1, 1, rows.length, n);
  if (plain) rng.setNumberFormat('@');
  rng.setValues(rows);
  sh.getRange(1, 1, 1, n).setFontWeight('bold').setBackground('#0b7a75').setFontColor('#ffffff');
  sh.setFrozenRows(1);
  for (var i = 1; i <= n; i++) sh.setColumnWidth(i, 140);
  const cf = [];
  (rules || []).forEach(function (r) {
    const c = t.header.indexOf(r.col) + 1;
    if (c < 1 || rows.length < 2) return;
    var b = SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo(r.text).setBackground(r.bg);
    if (r.fg) b = b.setFontColor(r.fg);
    cf.push(b.setRanges([sh.getRange(2, c, rows.length - 1, 1)]).build());
  });
  sh.setConditionalFormatRules(cf);
}

function ping_() {
  const root = root_();
  const ss = book_();
  return { ok: true, folder: root.getName(), folderUrl: root.getUrl(), sheetUrl: ss.getUrl() };
}

function syncAll_(d) {
  const root = root_();
  const ss = book_();
  put_(ss, 'Patient Recap', d.recap, true, [
    { col: 'Followed up', text: 'NO', bg: '#f4c7c3' },
    { col: 'Followed up', text: 'YES', bg: '#d9ead3' }
  ]);
  put_(ss, 'Inventory', d.inventory, false, [
    { col: 'Status', text: 'HABIS', bg: '#cc0000', fg: '#ffffff' },
    { col: 'Status', text: 'Hampir habis', bg: '#ea6b66' },
    { col: 'Status', text: 'Mau habis', bg: '#fde0dc' }
  ]);
  put_(ss, 'Finance', d.finance, false, []);
  const junk = ss.getSheetByName('Sheet1');
  if (junk && ss.getSheets().length > 1) ss.deleteSheet(junk);
  const json = JSON.stringify(d.backup);
  write_(root, 'dripwell-backup.json', json);
  const day = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  write_(sub_(root, 'Backups'), 'backup-' + day + '.json', json);
  return { ok: true, sheetUrl: ss.getUrl(), folderUrl: root.getUrl(), time: new Date().toISOString() };
}

function saveDoc_(d) {
  const folder = sub_(root_(), d.kind === 'inv' ? 'Invoices' : 'Medical Records');
  const name = String(d.filename || 'document.pdf').replace(/[\\\/:*?"<>|]/g, '_');
  const old = folder.getFilesByName(name);
  while (old.hasNext()) old.next().setTrashed(true);
  const blob = Utilities.newBlob(Utilities.base64Decode(d.data), 'application/pdf', name);
  const f = folder.createFile(blob);
  return { ok: true, url: f.getUrl(), name: name };
}

function restore_() {
  const it = root_().getFilesByName('dripwell-backup.json');
  if (!it.hasNext()) return { ok: false, error: 'No backup file found in Drive yet' };
  return { ok: true, data: JSON.parse(it.next().getBlob().getDataAsString()) };
}

function deleteDocs_(d) {
  const mr = String(d.mr || '').replace(/[^0-9A-Za-z]/g, '');
  if (!mr) return { ok: false, error: 'No MR number' };
  var n = 0;
  [['Medical Records', 'MedicalRecord-'], ['Invoices', 'Invoice-']].forEach(function (x) {
    const it = sub_(root_(), x[0]).getFiles();
    while (it.hasNext()) {
      const f = it.next();
      if (f.getName().indexOf(x[1] + mr + '-') === 0) { f.setTrashed(true); n++; }
    }
  });
  return { ok: true, trashed: n };
}

function sendEmail_(d) {
  const to = String(d.to || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return { ok: false, error: 'Invalid email address' };
  const name = String(d.filename || 'document.pdf').replace(/[\\\/:*?"<>|]/g, '_');
  const blob = Utilities.newBlob(Utilities.base64Decode(d.data), 'application/pdf', name);
  MailApp.sendEmail({
    to: to,
    subject: String(d.subject || 'Dripwell Bali'),
    body: String(d.body || ''),
    name: 'Dripwell Bali',
    replyTo: REPLY_TO,
    attachments: [blob]
  });
  return { ok: true };
}

function calc(p){const k=S.pkgs[p.pkg]||{h:0},base=k.h,pct=p.promoPct||0,harga=base*(1-pct/100),nurse=p.seq==1?300000:200000,doc=400000,ref=p.ref?harga*.15:0;
let obPkg=0,obExt=0,obAlk=0;
if(p.t&&p.t.length){p.t.forEach(t=>{const st=S.stock.find(x=>x.n===t.n),cost=(st?st.hpp:0)*t.q;if(!t.extra)obPkg+=cost;else if(st&&st.cat=='alkes')obAlk+=cost;else obExt+=cost})}else obPkg=p.obat||0;
const ob=obPkg+obExt+obAlk;
return{base,harga,disc:base-harga,nurse,doc,ob,obPkg,obExt,obAlk,ref,net:harga-nurse-doc-ob-ref}}

function reseq(){const c={};S.pts.forEach(p=>{const k=p.date+'|'+String(p.loc||'').trim().toLowerCase();c[k]=(c[k]||0)+1;p.seq=c[k]})}

const extraTotal=p=>(p.t||[]).filter(t=>t.extra&&!t.free).reduce((s,t)=>{const st=S.stock.find(x=>x.n===t.n);const price=st?(p.kat=='wna'?st.wna:st.lokal):0;return s+Math.round(price*t.q)},0);

function submitAll(){
const g=i=>$('f_'+i).value.trim();
if(!g('nm')||!g('lc')){alert('Name and Address are required');return}
const mrIn=g('mr').replace(/\s+/g,'');
if(!mrIn){alert('Medical Record Number is required');return}
if(!/^[0-9A-Za-z]+$/.test(mrIn)){alert('Medical Record Number may only contain letters and numbers (no spaces or symbols).');return}
if(S.pts.some((x,ix)=>ix!==editIdx&&String(x.mr).toLowerCase()===mrIn.toLowerCase())){alert('Medical Record Number '+mrIn+' is already used by another patient. Please choose a different number.');return}
const pkI=+$('f_pk').value,pk=S.pkgs[pkI];
const old=editIdx>=0?S.pts[editIdx]:null;
if(old)(old.t||[]).forEach(t=>{const st=S.stock.find(x=>x.n===t.n);if(st)st.q=rq(st.q+t.q)});
const need={};pk.comp.forEach(c=>{need[c.i]=(need[c.i]||0)+c.q});tmp.forEach(t=>{need[t.i]=(need[t.i]||0)+tq(t)});
const short=Object.keys(need).filter(i=>rq(S.stock[i].q)<rq(need[i])).map(i=>S.stock[i].n+' (stock '+fq(S.stock[i])+', needed '+rq(need[i])+' Strip)');
if(short.length&&!confirm('Insufficient stock:\n'+short.join('\n')+'\n\nSave anyway? Stock will be set to 0.')){if(old)(old.t||[]).forEach(t=>{const st=S.stock.find(x=>x.n===t.n);if(st)st.q=Math.max(0,rq(st.q-t.q))});return}
let ob=0;const used=[];
pk.comp.forEach(c=>{const s=S.stock[c.i];s.q=Math.max(0,rq(s.q-c.q));ob+=c.q*s.hpp;used.push({n:s.n,q:c.q})});
tmp.forEach(t=>{const s=S.stock[t.i],q=rq(tq(t));s.q=Math.max(0,rq(s.q-q));ob+=q*s.hpp;used.push({n:s.n,q,extra:true,u:t.u,c:t.n,free:!!t.free})});
const p={mr:mrIn,date:g('dt'),name:g('nm'),sex:g('sx'),dob:g('db'),nat:g('nt'),loc:g('lc'),email:g('em'),alg:g('al')||'(-)',kat:$('f_kat').value,
pkg:pkI,promoPct:+$('f_pr').value,pay:$('f_pay').value,ref:$('f_rf').checked,nurse:$('f_pn').value,dn:g('dn'),sip:g('sip'),
kx:g('kx'),pmh:g('pmh'),pmed:g('pmed'),td:g('td'),nd:g('nd'),sh:g('sh'),rr:g('rr'),sp:g('sp'),gcs:g('gcs'),vas:g('vas'),
ga:g('ga'),hd:g('hd'),ey:g('ey'),er:g('er'),no:g('no'),th:g('th'),tx:g('tx'),ab:g('ab'),ex:g('ex'),
dx:g('dx'),trt:g('trt'),rc:g('rc'),t:used,obat:ob,img:imgData,fu:false,fuDate:'',fuCond:'',fuNote:''};
if(old){['fu','fuDate','fuCond','fuNote','linkRM','linkInv','mailRM','mailInv'].forEach(k=>{p[k]=old[k]});
if(old.mr!==p.mr){CFG.pend.forEach(x=>{if(x.mr==old.mr)x.mr=p.mr});if(cloudOn()&&CFG.autoDocs){p.linkRM='';p.linkInv=''}saveCfg()}
S.pts[editIdx]=p;S.mrSeq=Math.max(S.mrSeq||0,parseInt(p.mr,10)||0);sel=selB=editIdx}
else{S.pts.push(p);S.mrSeq=Math.max(S.mrSeq||0,parseInt(p.mr,10)||0);sel=selB=S.pts.length-1}
const wasEdit=!!old,oldMr=old?old.mr:'',purge=CFG.pendDel.includes(p.mr);
if(purge){CFG.pendDel=CFG.pendDel.filter(z=>z!==p.mr);saveCfg()}
editIdx=-1;reseq();save();tmp=[];imgData='';tab=1;render();afterSave(p,wasEdit,oldMr,purge)}
function fillForm(p){
const set=(id,v)=>{const el=$('f_'+id);if(el)el.value=v==null?'':v};
set('dt',p.date);set('nm',p.name);set('sx',p.sex);set('db',p.dob);set('nt',p.nat);set('lc',p.loc);set('em',p.email);set('al',p.alg=='(-)'?'':p.alg);set('kat',p.kat);set('pk',p.pkg);set('pr',p.promoPct||0);set('pay',p.pay||'cash');$('f_rf').checked=!!p.ref;
if(p.nurse&&![...$('f_pn').options].some(o=>o.value===p.nurse)){const o=document.createElement('option');o.value=o.textContent=p.nurse;$('f_pn').appendChild(o)}
set('pn',p.nurse);
['dn','sip','kx','pmh','pmed','td','nd','sh','rr','sp','gcs','vas','ga','hd','ey','er','no','th','tx','ab','ex','dx','trt','rc'].forEach(k=>set(k,p[k]));

hint();pkgPreview();renderTL()}

async function delPatient(i){
const p=S.pts[i];if(!p)return;
if(!confirm('DELETE '+p.mr+' - '+p.name+'?\n\nThis removes the Medical Record AND the Invoice of this patient. This cannot be undone.'))return;
const used=p.t||[];
if(used.length&&confirm('Add the used medicine & consumables back to stock?\n\nOK = add back to stock\nCancel = keep stock as it is (the patient is still deleted)'))used.forEach(t=>{const st=S.stock.find(x=>x.n===t.n);if(st)st.q=rq(st.q+t.q)});
S.pts.splice(i,1);reseq();editIdx=-1;sel=-1;selB=-1;save();render();toast('Deleted '+p.mr+' - '+p.name);
if(cloudOn()){try{await gcall({action:'deleteDocs',mr:p.mr})}catch(err){if(!CFG.pendDel.includes(p.mr))CFG.pendDel.push(p.mr);saveCfg();toast('Deleted here, but Drive files could not be removed yet')}await syncNow(true)}}

const vit=(v,u)=>v?v+' '+u:'';

const used=p.t||[],meds=used.filter(t=>!isAl(t.n)),cons=used.filter(t=>isAl(t.n));
const li=a=>a.map(t=>e(t.n)+' x'+qtyStr(t)+(t.extra?' (extra)':'')).join(', ');

const sGA=has(p.ga,p.hd,p.ey,p.er,p.no,p.th,p.tx,p.ab,p.ex)?`<div class=sect>General Appearance</div><table class=idtab>${row('General Appearance',p.ga)}${row('Head',p.hd)}${row('Eyes',p.ey)}${row('Ears',p.er)}${row('Nose',p.no)}${row('Throat',p.th)}${row('Thorax',p.tx)}${row('Abdomen',p.ab)}${row('Extremities',p.ex)}</table>`:'';
const sDx=has(p.dx)?`<div class=sect>Diagnosis</div><p><b>${e(p.dx)}</b></p>`:'';

async function trySaveViaCapability(filename,blob){
try{
if(typeof claude==='undefined'||!claude.use)return false;
const downloads=await claude.use('downloads');
if(!downloads)return false;
await downloads.save({filename,data:blob});

}catch(err){

}}
function measureDoc(cel){
const r0=cel.getBoundingClientRect(),y0=r0.top;
const rel=el=>el.getBoundingClientRect().top-y0,relB=el=>el.getBoundingClientRect().bottom-y0;
const atomic='.sigblock,.metarow,.pay,.tot';
const items=[...cel.querySelectorAll('.lh,.tt,.sect,.bt,tr,p,img.attimg,'+atomic)].filter(el=>el.matches(atomic)||!el.closest(atomic));
const forb=[];
cel.querySelectorAll('.sect,.bt').forEach(h=>{const n=h.nextElementSibling;if(!n)return;let bt;if(n.tagName=='TABLE'){const r=n.querySelector('tr');bt=relB(r||n)}else bt=relB(n);forb.push([rel(h),bt])});
cel.querySelectorAll('table.it').forEach(t=>{const r=t.querySelector('tr');if(r)forb.push([rel(r),relB(r)])});
const tops=[...new Set(items.map(el=>Math.round(rel(el))))].filter(t=>t>0&&!forb.some(z=>t>z[0]+1&&t<=z[1]+1)).sort((x,y)=>x-y);
return{H:Math.ceil(r0.height),tops}}
function planPages(H,tops,pageH){
const pages=[];let pos=0;
while(pos<H-1){const lim=pos+pageH;if(H<=lim){pages.push([pos,H]);break}
const c=tops.filter(t=>t>pos+60&&t<=lim);const end=c.length?c[c.length-1]:lim;pages.push([pos,end]);pos=end}
return pages}
async function pdfBuild(src){
const W=794,SC=2,PW=595.28,PH=841.89,MT=28,MB=28;
const wrap=document.createElement('div');
wrap.style.cssText='position:absolute;left:-10000px;top:0;width:'+W+'px;background:#fff;pointer-events:none';
const doc=src.cloneNode(true);doc.removeAttribute('id');doc.classList.add('pdfdoc');
doc.style.cssText='width:'+W+'px;max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;box-sizing:border-box;padding:0 40px;background:#fff';
wrap.appendChild(doc);document.body.appendChild(wrap);
let M=null;
try{
await Promise.all([...doc.querySelectorAll('img')].map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()));
if(document.fonts&&document.fonts.ready){try{await document.fonts.ready}catch(x){}}
/* The page breaks are measured INSIDE html2canvas' own clone (same 794px layout that is drawn),
   so on phones the mobile CSS can no longer shift the text away from the planned cut lines. */
const canvas=await window.html2canvas(doc,{scale:SC,useCORS:true,backgroundColor:'#ffffff',windowWidth:W,windowHeight:1200,scrollX:0,scrollY:0,
onclone:(cd,cel)=>{try{if(cel.parentNode&&cel.parentNode.style)cel.parentNode.style.left='0px';M=measureDoc(cel)}catch(x){M=null}}});
const k=canvas.width/W;
const H=M?M.H:Math.round(canvas.height/k);
const pageH=(PH-MT-MB)*W/PW-4;
const pages=planPages(H,M?M.tops:[],pageH);
const {jsPDF}=window.jspdf;
const pdf=new jsPDF('p','pt','a4');
pages.forEach((pg,idx)=>{
const sy=Math.round(pg[0]*k);
const sh=Math.max(1,Math.min(Math.round((pg[1]-pg[0])*k),canvas.height-sy));
const c=document.createElement('canvas');c.width=canvas.width;c.height=sh;
const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,sh);
ctx.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
if(idx)pdf.addPage();
pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,MT,PW,sh*PW/canvas.width);
});
return pdf;
}finally{if(wrap.parentNode)wrap.parentNode.removeChild(wrap)}
}

if(btn){btn.textContent='Preparing PDF...';btn.disabled=true}
try{const pdf=await pdfBuild(src);const blob=pdf.output('blob');const ok=await trySaveViaCapability(filename,blob);if(!ok)pdf.save(filename)}
catch(err){alert('Could not generate PDF: '+(err&&err.message?err.message:err))}
finally{if(btn){btn.textContent=old;btn.disabled=false}}
}

// ---------- PWA: install & offline ----------
let deferredInstall=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function showInstallChip(){const el=$('inst');if(el)el.style.display=(isStandalone()||(!deferredInstall&&!isIOS()))?'none':'inline-block'}
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferredInstall=ev;showInstallChip()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;showInstallChip();toast('Dripwell installed ✓')});
async function installApp(){
if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(x){}deferredInstall=null;showInstallChip();return}
if(isIOS())alert('Untuk memasang di iPhone/iPad:\n1. Buka halaman ini di Safari\n2. Ketuk tombol Bagikan (kotak dengan panah ke atas)\n3. Pilih "Add to Home Screen" / "Tambah ke Layar Utama"');
else alert('Untuk memasang: buka menu browser (titik tiga) lalu pilih "Install app" / "Add to Home screen".')}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
boot();
